<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduFlex Academy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #0b1f3a;
            --navy-dark: #07172c;
            --navy-light: #16375f;
            --off-white: #f7f4ed;
            --white: #ffffff;
            --text: #142238;
            --muted: #697386;
            --border: #dfe3e8;
            --success: #16704a;
            --error: #b42335;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(11, 31, 58, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(22, 55, 95, 0.08),
                    transparent 30%
                ),
                var(--off-white);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            background: rgba(247, 244, 237, 0.94);
            border-bottom: 1px solid rgba(11, 31, 58, 0.12);
            backdrop-filter: blur(14px);
            position: relative;
            z-index: 10;
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        /* ================= LOGO ================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--navy);
            font-size: 22px;
            font-weight: 800;
            font-family: "Poppins", sans-serif;
        }

        .logo > span > span {
            color: var(--navy-light);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--navy-dark),
                    var(--navy-light)
                );

            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 800;

            box-shadow:
                0 8px 20px rgba(11, 31, 58, 0.20);
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {
            text-decoration: none;
            color: var(--navy);
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            color: var(--navy-light);
            transform: translateX(-3px);
        }


        /* ================= LOGIN AREA ================= */

        .login-wrapper {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 65px 20px;

            position: relative;
            overflow: hidden;
        }


        /* Decorative circles */

        .login-wrapper::before {
            content: "";
            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(11, 31, 58, 0.06);

            top: -130px;
            left: -120px;
        }

        .login-wrapper::after {
            content: "";
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(22, 55, 95, 0.05);

            bottom: -180px;
            right: -150px;
        }


        /* ================= LOGIN CARD ================= */

        .login-card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 450px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(11, 31, 58, 0.12);

            border-radius: 24px;

            padding: 44px;

            box-shadow:
                0 25px 70px rgba(11, 31, 58, 0.12);

            animation: cardEnter 0.7s ease;
        }


        @keyframes cardEnter {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ================= LOGIN ICON ================= */

        .login-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 20px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--navy-dark),
                    var(--navy-light)
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;

            box-shadow:
                0 14px 30px rgba(11, 31, 58, 0.22);

            animation: iconFloat 3s ease-in-out infinite;
        }


        @keyframes iconFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        /* ================= HEADING ================= */

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading h1 {
            font-family: "Poppins", sans-serif;

            font-size: 31px;

            color: var(--navy);

            margin-bottom: 9px;
        }

        .login-heading p {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.7;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;

            color: var(--text);
        }


        .form-group input {
            width: 100%;

            height: 53px;

            padding: 0 16px;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            font-size: 14px;

            font-family: inherit;

            color: var(--text);

            background: #fbfaf7;

            transition: 0.3s ease;
        }


        .form-group input::placeholder {
            color: #9aa2ad;
        }


        .form-group input:focus {
            border-color: var(--navy);

            background: var(--white);

            box-shadow:
                0 0 0 4px rgba(11, 31, 58, 0.08);
        }


        /* ================= PASSWORD ROW ================= */

        .password-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 8px;
        }

        .password-row label {
            margin-bottom: 0;
        }


        .forgot {
            color: var(--navy-light);

            font-size: 12px;

            text-decoration: none;

            font-weight: 700;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;

            height: 53px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--navy-dark),
                    var(--navy-light)
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            transition: 0.3s ease;

            margin-top: 5px;
        }


        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 28px rgba(11, 31, 58, 0.25);
        }


        .login-btn:active {
            transform: translateY(0);
        }


        /* ================= MESSAGE ================= */

        .message {
            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;
        }


        .message.success {
            display: block;

            background: #eaf7f0;

            color: var(--success);

            border: 1px solid #ccebdd;
        }


        .message.error {
            display: block;

            background: #fff0f1;

            color: var(--error);

            border: 1px solid #f3ccd1;
        }


        /* ================= DIVIDER ================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 28px 0;

            color: #9299a5;

            font-size: 12px;

            font-weight: 600;
        }


        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: var(--border);
        }


        /* ================= REGISTER ================= */

        .register-text {
            text-align: center;

            font-size: 14px;

            color: var(--muted);
        }


        .register-text a {
            color: var(--navy);

            font-weight: 800;

            text-decoration: none;
        }


        .register-text a:hover {
            color: var(--navy-light);

            text-decoration: underline;
        }


        /* ================= FOOTER ================= */

        .footer {
            text-align: center;

            padding: 20px;

            border-top:
                1px solid rgba(11, 31, 58, 0.10);

            color: #747d8c;

            font-size: 12px;

            background: var(--off-white);
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 15px 18px;
            }


            .logo {
                font-size: 19px;
            }


            .logo-icon {
                width: 36px;
                height: 36px;
            }


            .login-wrapper {
                padding: 40px 15px;
            }


            .login-card {
                padding: 32px 23px;

                border-radius: 20px;
            }


            .login-heading h1 {
                font-size: 26px;
            }


            .login-icon {
                width: 60px;
                height: 60px;
                font-size: 25px;
            }

        }


        @media (max-width: 400px) {

            .back-btn {
                font-size: 12px;
            }


            .login-card {
                padding: 28px 18px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                E
            </div>

            <span>
                Edu<span>Flex</span>
            </span>

        </a>


        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>

</header>



<!-- ================= LOGIN ================= -->

<main class="login-wrapper">

    <div class="login-card">


        <div class="login-icon">
            🎓
        </div>


        <div class="login-heading">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue your learning journey
                with EduFlex Academy.
            </p>

        </div>



        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <div class="password-row">

                    <label for="password">
                        Password
                    </label>

                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword">

                        Forgot Password?

                    </a>

                </div>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                Login →

            </button>



            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>

        </form>



        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>



        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a
                href="#"
                id="createAccount">

                Create Account

            </a>

        </div>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    © 2026 EduFlex Academy.
    All rights reserved.

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const forgotPassword =
        document.getElementById("forgotPassword");

    const createAccount =
        document.getElementById("createAccount");


    /* ================= LOGIN ================= */

    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value
                .trim();


            /* Empty fields */

            if (
                email === "" ||
                password === ""
            ) {

                message.className =
                    "message error";

                message.textContent =
                    "Please fill in all fields.";

                return;
            }


            /* Password validation */

            if (password.length < 6) {

                message.className =
                    "message error";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            /* Success */

            message.className =
                "message success";

            message.textContent =
                "Login successful! Welcome to EduFlex Academy.";


            /* Redirect */

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1500);

        }
    );


    /* ================= FORGOT PASSWORD ================= */

    forgotPassword.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            message.className =
                "message success";

            message.textContent =
                "Password reset feature will be available soon.";

        }
    );


    /* ================= CREATE ACCOUNT ================= */

    createAccount.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            message.className =
                "message success";

            message.textContent =
                "Account registration will be available soon.";

        }
    );

</script>


</body>

</html>
